[package]
name = "fly-telegram"
version = "0.1.0"
edition = "2021"
description = "Telegram userbot with a Lua module system"
license = "MIT"
repository = "https://github.com/BadPrivacyclub/rust-fly-telegram"

[[bin]]
name = "fly-telegram"
path = "src/main.rs"

[[bin]]
name = "music-worker"
path = "src/music_worker.rs"

[dependencies]
# Telegram userbot (MTProto)
grammers-client   = { version = "0.9", features = ["fs", "markdown"] }
grammers-session  = "0.9"
grammers-mtsender = { version = "0.9", features = ["proxy"] }

# Telegram Bot API (inline bot)
teloxide = { version = "0.17", features = ["macros"] }

# Lua module system (Lua 5.4, vendored)
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "send", "serde"] }

# Web authorization server
axum       = "0.8"
tower      = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# File watcher (hot-reload)
notify = "8"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow    = "1"
thiserror = "2"
uuid      = { version = "1", features = ["v4"] }
reqwest   = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
argon2    = "0.5"
base64    = "0.22"
chacha20poly1305 = "0.10"
rand      = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2      = "0.10"
libsql     = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum-test = "20"
