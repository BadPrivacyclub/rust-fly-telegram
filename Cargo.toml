[package]
name = "fly-telegram"
version = "0.2.2"
edition = "2021"
description = "Telegram userbot with a Lua module system"
license = "MIT"
repository = "https://github.com/BadPrivacyclub/rust-fly-telegram"

[[bin]]
name = "fly-telegram"
path = "src/main.rs"

[[bin]]
name = "music-worker"
path = "src/music_worker.rs"

[dependencies]
grammers-client   = { version = "0.9", features = ["fs", "markdown"] }
grammers-session  = "0.9"
grammers-mtsender = { version = "0.9", features = ["proxy"] }

teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }

mlua = { version = "0.11", features = ["lua54", "vendored", "async", "send", "serde"] }

axum       = { version = "0.8", features = ["multipart"] }
tower      = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

tokio = { version = "1", features = ["full"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

notify = "8"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow    = "1"
thiserror = "2"
uuid      = { version = "1", features = ["v4"] }
reqwest   = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "socks"] }
argon2    = "0.5"
base64    = "0.22"
chacha20poly1305 = "0.10"
rand      = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2      = "0.10"
libsql     = "0.9"
toml      = "0.8"
tar       = "0.4"
flate2    = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
printpdf = { version = "0.7", features = ["embedded_images", "font_subsetting"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ttf-parser = "0.19"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum-test = "20"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
